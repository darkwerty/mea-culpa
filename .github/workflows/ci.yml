name: CI

on:
  push:
    branches: [master]
  pull_request:

# Mínimo privilegio: el GITHUB_TOKEN de este workflow solo puede leer el repo.
permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements-dev.txt
            constraints.txt
      - run: pip install -r requirements-dev.txt -c constraints.txt
      - name: ruff
        run: ruff check . && ruff format --check .
      - name: pytest (modo mock, sin Azure)
        run: pytest -q
        env:
          LLM_PROVIDER: mock

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: docker build
        run: docker build -t mea-culpa-api:ci .
      - name: la imagen no arranca sin GOOGLE_CLIENT_ID y sí con él
        run: |
          if docker run --rm mea-culpa-api:ci python -c "import sys; sys.path.insert(0,'backend'); from meaculpa.main import create_app; create_app()"; then
            echo "La API arrancó sin GOOGLE_CLIENT_ID" && exit 1
          fi
          docker run --rm -e GOOGLE_CLIENT_ID=ci.apps.googleusercontent.com mea-culpa-api:ci \
            python -c "import sys; sys.path.insert(0,'backend'); from meaculpa.main import create_app; create_app()"
          docker run --rm mea-culpa-api:ci test ! -e backend/dev_server.py

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run generate
