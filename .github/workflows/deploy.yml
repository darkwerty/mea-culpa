name: Deploy

# Despliega la demo pública: imagen de la API en ACR (az acr build) -> Bicep (Container Apps, Foundry, Blob...) -> frontend en
# Static Web Apps. Sin secretos de larga duración: Azure se autentica por OIDC (credencial federada).
#
# Variables del repositorio (Settings > Secrets and variables > Actions > Variables), ninguna es secreta:
#   AZURE_CLIENT_ID, AZURE_TENANT_ID, AZURE_SUBSCRIPTION_ID  app registration con credencial federada
#                                                           repo:<owner>/mea-culpa:ref:refs/heads/master
#   AZURE_RESOURCE_GROUP                                    p. ej. rg-mea-culpa (creado en francecentral)
#   GOOGLE_CLIENT_ID                                        <id>.apps.googleusercontent.com
#   BIND_CUSTOM_DOMAIN                                      'true' cuando el CNAME meaculpa ya apunte a la SWA
# Mientras no exista AZURE_RESOURCE_GROUP el workflow no hace nada.

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  image:
    if: vars.AZURE_RESOURCE_GROUP != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    outputs:
      image: ${{ steps.build.outputs.image }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6 # v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      # El repo es privado: la imagen va al ACR del grupo (lo crea el Bicep) y se construye en la nube con
      # 'az acr build'. La Container App la descarga con su identidad administrada (AcrPull), sin credenciales.
      - id: build
        env:
          RG: ${{ vars.AZURE_RESOURCE_GROUP }}
        run: |
          acr=$(az acr list -g "$RG" --query "[0].name" -o tsv)
          test -n "$acr" || { echo "::error::No hay ACR en $RG: haz antes el primer despliegue manual del Bicep (README)"; exit 1; }
          az acr build -r "$acr" -t "mea-culpa-api:${GITHUB_SHA}" .
          echo "image=${acr}.azurecr.io/mea-culpa-api:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

  infra:
    needs: image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    outputs:
      apiUrl: ${{ steps.deploy.outputs.apiUrl }}
      webName: ${{ steps.deploy.outputs.webName }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6 # v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - id: deploy
        env:
          API_IMAGE: ${{ needs.image.outputs.image }}
          GOOGLE_CLIENT_ID: ${{ vars.GOOGLE_CLIENT_ID }}
          BIND_CUSTOM_DOMAIN: ${{ vars.BIND_CUSTOM_DOMAIN || 'false' }}
          RG: ${{ vars.AZURE_RESOURCE_GROUP }}
        run: |
          test -n "$GOOGLE_CLIENT_ID" || { echo "::error::Falta la variable GOOGLE_CLIENT_ID"; exit 1; }
          outputs=$(az deployment group create \
            --name "meaculpa-${GITHUB_RUN_NUMBER}" \
            --resource-group "$RG" \
            --template-file infra/main.bicep \
            --parameters infra/main.bicepparam \
            --query properties.outputs -o json)
          echo "apiUrl=$(jq -r .apiUrl.value <<< "$outputs")" >> "$GITHUB_OUTPUT"
          echo "webName=$(jq -r .webName.value <<< "$outputs")" >> "$GITHUB_OUTPUT"
          echo "API: $(jq -r .apiUrl.value <<< "$outputs"), SWA: $(jq -r .webDefaultHostname.value <<< "$outputs")"
      - name: comprobación de humo
        run: curl -fsS --retry 10 --retry-all-errors --retry-delay 15 "${{ steps.deploy.outputs.apiUrl }}/api/meaculpa/health"

  web:
    needs: infra
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      # La demo vive ahora en https://danielalonso.dev/meaculpa (repo de la web personal): esta SWA solo
      # publica infra/redirect, que redirige meaculpa.danielalonso.dev con un 301.
      - uses: azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6 # v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - id: swa
        run: |
          token=$(az staticwebapp secrets list -n "${{ needs.infra.outputs.webName }}" -g "${{ vars.AZURE_RESOURCE_GROUP }}" --query properties.apiKey -o tsv)
          echo "::add-mask::$token"
          echo "token=$token" >> "$GITHUB_OUTPUT"
      - uses: Azure/static-web-apps-deploy@1a947af9992250f3bc2e68ad0754c0b0c11566c9 # v1
        with:
          azure_static_web_apps_api_token: ${{ steps.swa.outputs.token }}
          action: upload
          app_location: infra/redirect
          skip_app_build: true
          skip_api_build: true
